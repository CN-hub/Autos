<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Autos Jurídico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:wght@500;600;700&display=swap">
<style>
/* Layout: barra lateral escura (navegação) + área de trabalho em lista; no celular a barra vira faixa superior com abas roláveis.
   A "capa dos autos" abre cada processo. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface2:#F5F7F9; --fg:#15202B; --muted:#5A6A7A;
  --line:#D9E0E7; --line2:#C3CDD7;
  --nav:#FFFFFF; --navfg:#1E2F42; --navmute:#5A6A7A; --navsel:#E3ECF7; --navbrand:#12233A; --navselfg:#1D4E89; --navline:#D9E0E7;
  --accent:#1D4E89; --accent-fg:#FFFFFF; --accent-soft:#E3ECF7;
  --ok:#1B7A4B; --ok-bg:#E1F3E8; --warn:#9A5B00; --warn-bg:#FBEBD0; --crit:#B3261E; --crit-bg:#FADCD9; --info:#1D4E89; --info-bg:#E3ECF7; --mute:#52606E; --mute-bg:#E8ECF0; --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --disp:'Source Serif 4',Georgia,'Times New Roman',serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1520; --surface:#152130; --surface2:#1A293B; --fg:#E5ECF3; --muted:#93A4B5;
  --line:#26384B; --line2:#35495E;
  --nav:#09111B; --navfg:#D7E0EA; --navmute:#7F92A6; --navsel:#1B3050; --navbrand:#FFFFFF; --navselfg:#FFFFFF; --navline:#1B2B3E;
  --accent:#6FA8E6; --accent-fg:#0A1522; --accent-soft:#1B3350;
  --ok:#5CCB92; --ok-bg:#16352A; --warn:#F0B35A; --warn-bg:#3A2D14; --crit:#FF8D84; --crit-bg:#431E1B; --info:#7DB2EE; --info-bg:#1B3350; --mute:#A6B4C2; --mute-bg:#223244; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s1:#3987E5; --s2:#D95926; --o1:#184F95; --o2:#256ABF; --o3:#2A78D6; --o4:#3987E5; --o5:#6DA7EC; --o6:#86B6EF;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1520; --surface:#152130; --surface2:#1A293B; --fg:#E5ECF3; --muted:#93A4B5;
  --line:#26384B; --line2:#35495E;
  --nav:#09111B; --navfg:#D7E0EA; --navmute:#7F92A6; --navsel:#1B3050; --navbrand:#FFFFFF; --navselfg:#FFFFFF; --navline:#1B2B3E;
  --accent:#6FA8E6; --accent-fg:#0A1522; --accent-soft:#1B3350;
  --ok:#5CCB92; --ok-bg:#16352A; --warn:#F0B35A; --warn-bg:#3A2D14; --crit:#FF8D84; --crit-bg:#431E1B; --info:#7DB2EE; --info-bg:#1B3350; --mute:#A6B4C2; --mute-bg:#223244; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s1:#3987E5; --s2:#D95926; --o1:#184F95; --o2:#256ABF; --o3:#2A78D6; --o4:#3987E5; --o5:#6DA7EC; --o6:#86B6EF;
  color-scheme:dark}

/* acessibilidade: tamanho do texto, alto contraste, movimento reduzido */
:root[data-fs="1"]{font-size:112.5%}
:root[data-fs="2"]{font-size:125%}
:root[data-contrast="alto"]{--muted:color-mix(in srgb,var(--fg) 86%,var(--bg));--line:color-mix(in srgb,var(--fg) 45%,var(--bg));--line2:color-mix(in srgb,var(--fg) 70%,var(--bg));--navmute:var(--muted)}
:root[data-motion="reduzido"] *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:0.875rem/1.5 var(--body);-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:var(--mono);font-size:.92em}
.app{min-height:100%}
[hidden]{display:none!important}
:root{--tbh:60px}

/* barra superior com menu hambúrguer */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:12px;background:var(--nav);color:var(--navfg);border-bottom:1px solid var(--navline);min-height:var(--tbh);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.in-app::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:90;background:var(--nav)}
.tb-title{display:flex;align-items:baseline;gap:12px;min-width:0;flex:1}
.tb-brand{font:700 1.375rem/1 var(--disp);color:var(--navbrand)}
.crumb{font-weight:600;color:var(--navfg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;padding-left:12px;border-left:1px solid var(--line2)}
.sidetools{display:flex;gap:6px;flex:none}
.tbtn{background:transparent;border:1px solid var(--line2);color:var(--navfg);border-radius:5px;padding:4px 12px;font-size:0.8125rem;min-height:38px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.tbtn.ic{width:38px;padding:0}
.tbtn svg{display:block}
.tbtn:hover{background:var(--surface2)}

/* menu lateral (gaveta no celular, recolhível no computador) */
.shell{display:grid;grid-template-columns:minmax(0,1fr)}
.side{background:var(--nav);color:var(--navfg)}
.side-in{display:flex;flex-direction:column;gap:18px;min-height:100%;padding:16px 12px 20px;padding-left:max(12px,env(safe-area-inset-left,0px))}
.drawerhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding-inline:8px}
.brand{display:flex;flex-direction:column;gap:0}
.brand b{font:700 1.375rem/1.1 var(--disp);letter-spacing:.01em;color:var(--navbrand)}
.brand span{font-size:0.75rem;color:var(--navmute);overflow-wrap:anywhere}
.nav{display:flex;flex-direction:column;gap:16px}
.ng{display:flex;flex-direction:column;gap:2px}
.ngl{margin:0;padding:0 12px 4px;font-size:0.6875rem;text-transform:uppercase;letter-spacing:.1em;color:var(--navmute)}
.nav button{display:flex;align-items:center;gap:12px;width:100%;background:transparent;border:0;color:var(--navfg);padding:9px 12px;border-radius:6px;text-align:left}
.nav button svg{flex:none;opacity:.85}
.nav button:hover{background:var(--surface2)}
.nav button[aria-current="page"]{background:var(--navsel);color:var(--navselfg);font-weight:600}
.nav button[aria-current="page"] svg{opacity:1}
.nl{flex:1;min-width:0}
.nav .cnt{background:var(--crit-bg);color:var(--crit);border-radius:99px;font-size:0.6875rem;padding:0 7px;line-height:18px;font-weight:600}
.sidefoot{margin-top:auto;padding:0 12px;font-size:0.75rem;line-height:1.45;color:var(--navmute)}
.scrim{position:fixed;inset:0;z-index:35;background:rgba(7,13,21,.55)}
@media (max-width:899.98px){
  .side{position:fixed;top:0;bottom:0;left:0;z-index:40;width:min(300px,86vw);overflow-y:auto;border-right:1px solid var(--navline);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transform:translateX(-102%);visibility:hidden;transition:transform .22s ease,visibility 0s linear .22s}
  .app.menu-open .side{transform:none;visibility:visible;box-shadow:0 0 40px rgba(0,0,0,.35);transition:transform .22s ease}
}
@media (max-width:480px){
  .tb-brand{display:none}
  .crumb{padding-left:0;border-left:0}
}
@media (min-width:900px){
  .app.menu-open .shell{grid-template-columns:264px minmax(0,1fr)}
  .side{display:none;position:sticky;top:calc(var(--tbh) + env(safe-area-inset-top,0px));height:calc(100vh - var(--tbh));align-self:start;overflow-y:auto;border-right:1px solid var(--navline)}
  .app.menu-open .side{display:block}
  .drawerclose,.scrim{display:none!important}
  .main{padding-left:32px!important}
}

/* área de trabalho */
.main{min-width:0;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;display:flex;flex-direction:column;gap:22px}
.pghead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.pghead h1{font:600 clamp(1.5rem,5vw,1.875rem)/1.15 var(--disp);text-wrap:balance}
.sub{color:var(--muted);margin-top:2px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{background:var(--surface);border:1px solid var(--line2);border-radius:5px;padding:8px 14px;min-height:38px;font-weight:500}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{min-height:30px;padding:3px 10px;font-size:0.8125rem}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn:disabled{opacity:.6;cursor:default}
.ib{background:transparent;border:0;color:var(--accent);padding:4px 6px;font-size:0.8125rem;font-weight:500;border-radius:4px}
.ib:hover{background:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.h2{font:600 0.75rem/1 var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.note{background:var(--info-bg);color:var(--info);border-radius:6px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.note.crit{background:var(--crit-bg);color:var(--crit)}
.loading,.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty{display:flex;flex-direction:column;align-items:center;gap:12px}

/* painel */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:6px}
.kpi{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border-right:1px solid var(--line);min-width:0}
.kpi:last-child{border-right:0}
.kl{font-size:0.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.kv{font:600 1.875rem/1.15 var(--disp);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kv.crit{color:var(--crit)}
.ks{font-size:0.7812rem;color:var(--muted)}
@media (max-width:780px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(2){border-right:0}.kpi:nth-child(-n+2){border-bottom:1px solid var(--line)}}
.cols2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:22px;align-items:start}
@media (max-width:900px){.cols2{grid-template-columns:minmax(0,1fr)}}
.bars{display:flex;flex-direction:column;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px}
.bar{display:grid;grid-template-columns:104px minmax(0,1fr) 22px;gap:10px;align-items:center;font-size:0.8125rem}
.bar i{display:block;height:8px;border-radius:2px;background:var(--accent);min-width:2px}
.bar em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}

/* listas */
.list{container-type:inline-size;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 14px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.nolead{grid-template-columns:minmax(0,1fr) auto}
.row.prazo{grid-template-columns:auto auto minmax(0,1fr) auto}
.row.click{cursor:pointer}
.row.click:hover{background:var(--surface2)}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.rm{min-width:0}
.t{font-weight:600;overflow-wrap:anywhere}
.s{color:var(--muted);font-size:0.8125rem;overflow-wrap:anywhere}
.ra{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end}
.ra.col{flex-direction:column;align-items:flex-end;gap:4px}
.val{font:600 1rem var(--disp);font-variant-numeric:tabular-nums}
@container (max-width:620px){
  .row{grid-template-columns:auto minmax(0,1fr)}
  .row.nolead{grid-template-columns:minmax(0,1fr)}
  .row.prazo{grid-template-columns:auto auto minmax(0,1fr)}
  .row .ra,.row .ra.col{grid-column:1/-1;justify-content:flex-start;align-items:center;flex-direction:row}
}
.dt{width:46px;text-align:center;border:1px solid var(--line);border-radius:5px;padding:4px 0;background:var(--surface2);line-height:1.1}
.dt b{display:block;font:600 1.125rem var(--disp)}
.dt span{font-size:0.6875rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.chk{width:24px;height:24px;border:1.5px solid var(--muted);border-radius:5px;background:transparent;position:relative;padding:0;flex:none}
.chk.on{background:var(--ok);border-color:var(--ok)}
.chk.on::after{content:"";position:absolute;left:7px;top:2px;width:6px;height:12px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.b{display:inline-block;padding:1px 9px;border-radius:99px;font-size:0.75rem;font-weight:500;line-height:1.65;white-space:nowrap}
.b.ok{background:var(--ok-bg);color:var(--ok)}.b.warn{background:var(--warn-bg);color:var(--warn)}.b.crit{background:var(--crit-bg);color:var(--crit)}.b.info{background:var(--info-bg);color:var(--info)}.b.mute{background:var(--mute-bg);color:var(--mute)}
.sep{font:600 0.75rem var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:6px 0 -10px}

/* filtros */
.tools{display:flex;flex-wrap:wrap;gap:8px}
.tools .grow{flex:1 1 220px}
.tools select{width:auto;flex:1 1 150px;min-width:0}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line2);border-radius:5px;padding:8px 10px;width:100%;min-height:38px}
textarea{resize:vertical}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:5px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 14px;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);font-weight:600}

/* capa dos autos */
.capa{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:16px}
.capa-k{font:500 0.6875rem var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.capa .num{font:500 clamp(1.0625rem,4.6vw,1.625rem)/1.25 var(--mono);overflow-wrap:anywhere}
.partes{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline}
.partes div span{display:block;font-size:0.6875rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.partes b{font:600 1.0625rem var(--disp);overflow-wrap:anywhere}
.partes .x{font:400 1.25rem var(--disp);color:var(--muted)}
.linkb{background:none;border:0;padding:0;color:var(--accent);text-align:left;text-decoration:underline;text-underline-offset:3px;font:inherit;font-weight:600}
ol.steps{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
ol.steps li{border:1px solid var(--line2);border-radius:99px;padding:2px 12px;font-size:0.7812rem;color:var(--muted)}
ol.steps li.past{background:var(--mute-bg);border-color:transparent}
ol.steps li.cur{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 18px}
.meta div{min-width:0}
.meta span{display:block;font-size:0.6875rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.meta b{font-weight:500;overflow-wrap:anywhere}
.meta select{margin-top:2px}
.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line2);display:flex;flex-direction:column;gap:14px}
.tl li{position:relative}
.tl li::before{content:"";position:absolute;left:-24px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.tl time{font:500 0.75rem var(--mono);color:var(--muted)}
.tl p{overflow-wrap:anywhere;white-space:pre-wrap}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px}
.contact{display:flex;flex-wrap:wrap;gap:6px 22px}
.contact span{color:var(--muted)}

/* calendário */
.agenda{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:22px;align-items:start}
@media (max-width:900px){.agenda{grid-template-columns:minmax(0,1fr)}}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.calhead b{font:600 1.125rem var(--disp);text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal .wd{font-size:0.6875rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding:4px 0}
.cd{background:var(--surface);border:1px solid var(--line);border-radius:5px;min-height:56px;padding:4px 5px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left}
.cd.blank{border:0;background:transparent}
.cd span{font-variant-numeric:tabular-nums;font-weight:500}
.cd.off{background:var(--surface2);color:var(--muted)}
.cd.today span{background:var(--accent);color:var(--accent-fg);border-radius:99px;padding:0 6px}
.cd.sel{outline:2px solid var(--accent);outline-offset:-2px}
.cd i{display:flex;gap:3px;flex-wrap:wrap}
.cd i u{width:7px;height:7px;border-radius:50%;background:var(--accent);display:block}
.cd i u.f{background:var(--crit)}.cd i u.a{background:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:0.7812rem;color:var(--muted);margin-top:10px}
.legend u{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:5px}
.legend u.f{background:var(--crit)}.legend u.a{background:var(--muted)}

/* janelas */
.ov{position:fixed;inset:0;z-index:50;background:rgba(7,13,21,.6);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dlg{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:8px;width:min(640px,100%);padding:20px;margin-block:auto;display:flex;flex-direction:column;gap:14px}
.dlg h2{font:600 1.375rem var(--disp)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld>span{font-size:0.7812rem;font-weight:500;color:var(--muted)}
@media (max-width:560px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.btns{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:4px}
.ferr{color:var(--crit);min-height:0}
.ferr:empty{display:none}
.calc{border:1px dashed var(--line2);border-radius:6px;padding:12px;margin-top:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface2)}
.crow{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:10px;align-items:end}
@media (max-width:560px){.crow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.crow .btn{grid-column:1/-1}}
.hint{font-size:0.7812rem;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:6px;z-index:60;max-width:min(520px,calc(100% - 32px));box-shadow:0 6px 24px rgba(0,0,0,.25)}
.cfg{display:grid;gap:14px;max-width:620px}
input[type=checkbox]{width:18px;min-height:18px;height:18px;padding:0;accent-color:var(--accent);flex:none}
.chkl{display:flex;gap:10px;align-items:center;font-weight:500;cursor:pointer}

async function makeBackup(tipo){
  var now=new Date(),txt=snapshotJSON();
  var id=tipo==='auto'?'b-auto-'+now.getFullYear()+pad(now.getMonth()+1)+pad(now.getDate())+pad(now.getHours()):uid('b-m-');
  var cont={};COLS.forEach(function(c){cont[c]=S[c].length});
  var meta={criadoEm:now.toISOString(),tipo:tipo,contagem:cont,bytes:txt.length};
  if(DB){
    var n=Math.ceil(txt.length/100000);
    for(var i=0;i<n;i++)await DB.collection('backupdata').doc(id+'_'+i).set({txt:txt.slice(i*100000,(i+1)*100000)});
    meta.partes=n;
    await DB.collection('backups').doc(id).set(meta);
    var old=BK.filter(function(b){return b.id!==id}).slice(MAXBK-1);
    for(var k=0;k<old.length;k++){
      for(var j=0;j<(old[k].partes||1);j++)await DB.collection('backupdata').doc(old[k].id+'_'+j).delete();
      await DB.collection('backups').doc(old[k].id).delete();
    }
  }else{
    var arr=readLocalBk().filter(function(b){return b.id!==id});
    arr.unshift(Object.assign({id:id,dados:txt},meta));arr=arr.slice(0,10);
    localStorage.setItem(LSB,JSON.stringify(arr));
    BK=arr.map(function(b){return {id:b.id,criadoEm:b.criadoEm,tipo:b.tipo,contagem:b.contagem,bytes:b.bytes}});
    render();
  }
}

function subscribe(){
  var pending=COLS.length+1,fin=false;
  var done=function(){pending--;if(pending===0&&!fin){fin=true;ready=true;render();afterReady()}};
  COLS.forEach(function(c){var first=true;
    DB.collection(c).onSnapshot(function(snap){S[c]=snap.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});if(first){first=false;done()}else render()},function(){if(first){first=false;done()}});
  });
  DB.collection('backups').onSnapshot(function(snap){
    BK=snap.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})}).sort(function(a,b){return String(b.criadoEm).localeCompare(String(a.criadoEm))});
    var first=!bkReady;bkReady=true;if(ready)render();if(first)autoTick();
  },function(){bkReady=true});
  var firstC=true;
  DB.doc('config/app').onSnapshot(function(s){if(s.exists)S.config=Object.assign({},S.config,s.data());if(firstC){firstC=false;done()}else render()},function(){if(firstC){firstC=false;done()}});
}

/* dicas dos gráficos (mouse, toque e teclado) */
function tipPos(x,y){var w=tipEl.offsetWidth,h=tipEl.offsetHeight,L=Math.min(Math.max(8,x+14),window.innerWidth-w-8),T=(y-h-14<8)?y+18:y-h-14;tipEl.style.left=L+'px';tipEl.style.top=T+'px'}
function tipShow(el,x,y){var p=el.getAttribute('data-tip').split('|');tipEl.innerHTML='<b>'+esc(p[0])+'</b>'+p.slice(1).map(function(s){return '<span>'+esc(s)+'</span>'}).join('');tipEl.hidden=false;tipPos(x,y)}
document.addEventListener('mouseover',function(e){var m=e.target.closest&&e.target.closest('[data-tip]');if(m)tipShow(m,e.clientX,e.clientY)});
document.addEventListener('mousemove',function(e){if(!tipEl.hidden)tipPos(e.clientX,e.clientY)});
document.addEventListener('mouseout',function(e){var m=e.target.closest&&e.target.closest('[data-tip]');if(m&&!(e.relatedTarget&&m.contains(e.relatedTarget)))tipEl.hidden=true});
document.addEventListener('focusin',function(e){var m=e.target.closest&&e.target.closest('[data-tip]');if(m){var r=m.getBoundingClientRect();tipShow(m,r.left+r.width/2,r.top)}});
document.addEventListener('focusout',function(){tipEl.hidden=true});
async function boot(){
  render();
  var db=null;
  try{if(window.claude&&window.claude.use)db=await window.claude.use('db')}catch(e){db=null}
  if(db){DB=db;backend='db';subscribe()}
  else{backend='local';loadLocal();ready=true;render();autoTick()}
}
boot();
})();
</script>

</body>
</html>
